
[tool.poetry]
name = "geoprob_pipe"
version = "2.2.11"
description = "Execute probabilistic piping calculations using the Deltares probabilic library."
keywords = [
  "levee",
  "dike",
  "piping",
  "probabilistic",
  "water-safety",
  "hydrology",
]
authors = [
    "Chris Pitzalis <C.Pitzalis@wsrl.nl>",
    "Vincent Jilesen <V.Jilesen@wshd.nl>",
    "Sander Kapinga <S.Kapinga@wsrl.nl>",
    "Laura van der Doef <L.vanderDoef@wshd.nl>",
]
license = "GPL-3.0-or-later"
readme = "other/PyPI_README.md"
homepage = "https://kkpdata.github.io/GeoProb-Pipe/"
repository = "https://github.com/kkpdata/GeoProb-Pipe"
documentation = "https://kkpdata.github.io/GeoProb-Pipe/"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"  # TODO: Unit test and add 3.13 en 3.14
pandas = ">=2.0,<3.0"  # pydra-core 0.0.10 and earlier is not update to the latest version of pandas.
pydra-core = "0.0.10"  # TODO: There is a newer version available. Test with that.
probabilistic-library = "26.1.1"
# The following is not yet restricted, but should be TODO
scipy = "^1.16.1"
geopandas = "^1.1.1"
plotly = "^6.2.0"
openpyxl = "^3.1.5"
kaleido = "^1.0.0"
colorlog = "^6.9.0"
typer = "^0.17.3"
inquirerpy = "^0.3.4"
rasterio = "^1.4.3"


[tool.poetry.scripts]
geoprob_pipe = "geoprob_pipe.cmd_app.cmd:app"
geoprob-pipe = "geoprob_pipe.cmd_app.cmd:app"